# Author: Rajveer Sharma
# © NxtWave
# Date: 16 October 2026
# Every push and pull request: lint and security audits, the tests on both databases, the
# frontend build with its bundle budget, and Lighthouse on the main pages. All free on GitHub.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dash_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Security audit (pip-audit)
        run: pip-audit --skip-editable
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL (summary parity, query budgets, rebuild under 2 s)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/dash_test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1" # Lighthouse uses the runner's Chrome
      - name: Lint (ESLint)
        run: npm run lint
      - name: Security audit (what users download)
        run: npm run audit:prod
      - name: Type-check, build, bundle budget
        run: npm run build

  lighthouse:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dash_demo
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/dash_demo
      SECRET_KEY: ci-only-not-a-secret
      LHCI_BASE_URL: http://127.0.0.1:8010
      LHCI_EMAIL: lighthouse@example.com
      LHCI_PASSWORD: ci-only-password-1
      LHCI_CPU_SLOWDOWN: "1"  # the runner's CPU is already as slow as the laptop we budget for
      CHROME_PATH: /usr/bin/google-chrome
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Demo data at full size (1,500 students x 52 contests)
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          echo "$LHCI_PASSWORD" | python scripts/seed_demo.py --database-url "$DATABASE_URL" \
            --students 1500 --contests 52 --admin "$LHCI_EMAIL" --password-stdin
      - name: Start the API (serves the built frontend)
        working-directory: backend
        run: |
          nohup python -m app.cli serve --port 8010 > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8010/api/health && exit 0; sleep 1; done
          cat ../api.log; exit 1
      - name: Lighthouse (LCP, CLS, blocking time, script size)
        working-directory: frontend
        run: npx lhci autorun
      - name: Slowest routes during the run
        if: always()
        working-directory: backend
        run: python scripts/slow_routes.py ../api.log || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/
